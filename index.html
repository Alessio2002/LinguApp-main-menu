<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parlar Ioniano - LinguApp</title>
    <style>
        :root {
            --ionian-blue: #1a5695;
            --ionian-gold: #f2b82e;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* BACKGROUND FIX:*/
            background-image: url('https://raw.githubusercontent.com/Alessio2002/LinguApp-main-menu/main/Book%20cover.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: var(--ionian-blue); /* Fallback colour */
        }

        .menu-wrapper {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 90%;
            max-width: 400px;
            align-items: center;
        }

        .app-container {
            width: 100%;
            background: var(--white);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            text-align: center;
            padding-bottom: 35px;
            transition: transform 0.3s ease;
        }

        .app-container:hover {
            transform: translateY(-5px);
        }

        .content {
            padding: 25px 20px;
        }

        h1 {
            color: var(--ionian-blue);
            font-size: 1.8rem;
            margin-bottom: 10px;
            margin-top: 15px;
        }

        p {
            color: #666;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .menu-button {
            display: inline-block;
            background-color: var(--ionian-blue);
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(26, 86, 149, 0.3);
            width: 80%;
            box-sizing: border-box;
        }

        .menu-button:hover {
            background-color: #144476;
        }

        /* Loading Animation */
        .fade-in {
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="menu-wrapper fade-in">
        <div class="app-container">
            <div class="content">
                <h1>Benvenudi!</h1>
                <p>Ready to master the Ionian language?</p>
                <button id="startBtn" class="menu-button">Apri linguApp</button>
            </div>
        </div>

        <div class="app-container">
            <div class="content">
                <h1>Manuale di pronunzzia</h1>
                <p>Master Ionian phonetics and sounds.</p>
                <button id="pronounceBtn" class="menu-button">Apri Pronunzzia</button>
            </div>
        </div>
    </div>

    <script>
        // LinguApp Main Redirect
        document.getElementById('startBtn').addEventListener('click', function() {
            this.innerText = "Carricamento...";
            setTimeout(() => {
                window.location.href = "https://alessio2002.github.io/LinguApp/";
            }, 300);
        });

        // Pronunciation Guide Redirect
        document.getElementById('pronounceBtn').addEventListener('click', function() {
            this.innerText = "Carricamento...";
            setTimeout(() => {
                window.location.href = "https://alessio2002.github.io/Pronunciation/";
            }, 300);
        });
    </script>
</body>
</html>
